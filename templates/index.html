<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Stats</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .app { max-width: 680px; margin: 0 auto; }

    .header { margin-bottom: 2rem; }
    .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .logo {
      width: 32px; height: 32px; border-radius: 50%;
      background: #E24B4A;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 18px; height: 18px; }
    .app-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .app-sub { font-size: 13px; color: #888; }

    .tabs {
      display: flex; gap: 4px;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #222;
    }
    .tab {
      padding: 8px 16px; font-size: 14px; font-weight: 400;
      color: #888; background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color 0.15s;
    }
    .tab.active { color: #f0f0f0; border-bottom-color: #E24B4A; font-weight: 500; }
    .tab:hover:not(.active) { color: #ccc; }

    .panel { display: none; }
    .panel.active { display: block; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-label {
      font-size: 11px; color: #666; margin-bottom: 5px;
      display: block; text-transform: uppercase; letter-spacing: 0.6px;
    }

    input[type="text"] {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border-radius: 8px; border: 1px solid #2a2a2a;
      background: #1a1a1a; color: #f0f0f0; outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]::placeholder { color: #444; }
    input[type="text"]:focus { border-color: #E24B4A; box-shadow: 0 0 0 3px rgba(226,75,74,0.1); }

    .season-input { max-width: 160px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; font-size: 14px; font-weight: 500;
      border-radius: 8px; border: 1px solid #2a2a2a;
      background: #1a1a1a; color: #f0f0f0; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn:hover { background: #222; border-color: #333; }
    .btn-primary { background: #E24B4A; color: white; border-color: #E24B4A; }
    .btn-primary:hover { background: #c93b3a; border-color: #c93b3a; }

    .loading { font-size: 13px; color: #666; padding: 1rem 0; display: none; }
    .error-msg { font-size: 13px; color: #E24B4A; padding: 0.5rem 0; display: none; }

    .result-card {
      margin-top: 1.5rem;
      background: #1a1a1a; border: 1px solid #222;
      border-radius: 12px; padding: 1.25rem; display: none;
    }
    .result-card.visible { display: block; }
    .result-name { font-size: 15px; font-weight: 500; color: #ccc; margin-bottom: 1rem; }

    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat-box {
      background: #111; border-radius: 8px;
      padding: 14px; text-align: center;
    }
    .stat-value { font-size: 32px; font-weight: 600; color: #f0f0f0; line-height: 1; margin-bottom: 5px; }
    .stat-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.6px; }

    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1.5rem; }
    .compare-card {
      background: #1a1a1a; border: 1px solid #222;
      border-radius: 12px; padding: 1.25rem; display: none;
    }
    .compare-card.visible { display: block; }
    .compare-name {
      font-size: 14px; font-weight: 500; color: #f0f0f0;
      margin-bottom: 12px; padding-bottom: 10px;
      border-bottom: 1px solid #222;
    }
    .compare-stat {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 8px 0; border-bottom: 1px solid #1f1f1f;
    }
    .compare-stat:last-child { border-bottom: none; }
    .compare-stat-label { font-size: 12px; color: #555; }
    .compare-stat-value { font-size: 20px; font-weight: 500; color: #f0f0f0; }
    .compare-stat-value.winner { color: #1D9E75; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" fill="white"/>
            <path d="M12 2a10 10 0 0 1 0 20M12 2a10 10 0 0 0 0 20M2 12h20" stroke="#E24B4A" stroke-width="1.5"/>
          </svg>
        </div>
        <span class="app-title">NBA Stats</span>
      </div>
      <div class="app-sub">Player stats powered by nba_api</div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('search')">Player lookup</button>
      <button class="tab" onclick="switchTab('compare')">Compare players</button>
    </div>

    <div id="panel-search" class="panel active">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Player name</label>
          <input type="text" id="s-player" placeholder="e.g. LeBron James">
        </div>
        <div class="form-group">
          <label class="form-label">Season</label>
          <input type="text" id="s-season" placeholder="e.g. 2023-24" class="season-input">
        </div>
      </div>
      <button class="btn btn-primary" onclick="doSearch()">Get stats</button>
      <div class="loading" id="s-loading">Fetching stats...</div>
      <div class="error-msg" id="s-error"></div>
      <div class="result-card" id="s-result">
        <div class="result-name" id="s-name"></div>
        <div class="stat-grid">
          <div class="stat-box">
            <div class="stat-value" id="s-ppg">—</div>
            <div class="stat-label">PPG</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="s-ast">—</div>
            <div class="stat-label">AST</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="s-reb">—</div>
            <div class="stat-label">REB</div>
          </div>
        </div>
      </div>
    </div>

    <div id="panel-compare" class="panel">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Player 1</label>
          <input type="text" id="c-p1" placeholder="e.g. LeBron James">
        </div>
        <div class="form-group">
          <label class="form-label">Player 2</label>
          <input type="text" id="c-p2" placeholder="e.g. Devin Booker">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Season</label>
        <input type="text" id="c-season" placeholder="e.g. 2023-24" class="season-input">
      </div>
      <button class="btn btn-primary" onclick="doCompare()">Compare</button>
      <div class="loading" id="c-loading">Fetching stats...</div>
      <div class="error-msg" id="c-error"></div>
      <div class="compare-grid">
        <div class="compare-card" id="c-card1">
          <div class="compare-name" id="c-name1"></div>
          <div class="compare-stat">
            <span class="compare-stat-label">PPG</span>
            <span class="compare-stat-value" id="c1-ppg">—</span>
          </div>
          <div class="compare-stat">
            <span class="compare-stat-label">AST</span>
            <span class="compare-stat-value" id="c1-ast">—</span>
          </div>
          <div class="compare-stat">
            <span class="compare-stat-label">REB</span>
            <span class="compare-stat-value" id="c1-reb">—</span>
          </div>
        </div>
        <div class="compare-card" id="c-card2">
          <div class="compare-name" id="c-name2"></div>
          <div class="compare-stat">
            <span class="compare-stat-label">PPG</span>
            <span class="compare-stat-value" id="c2-ppg">—</span>
          </div>
          <div class="compare-stat">
            <span class="compare-stat-label">AST</span>
            <span class="compare-stat-value" id="c2-ast">—</span>
          </div>
          <div class="compare-stat">
            <span class="compare-stat-label">REB</span>
            <span class="compare-stat-value" id="c2-reb">—</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0) === (tab === 'search'));
      });
      document.getElementById('panel-search').classList.toggle('active', tab === 'search');
      document.getElementById('panel-compare').classList.toggle('active', tab === 'compare');
    }

    async function doSearch() {
      const player = document.getElementById('s-player').value.trim();
      const season = document.getElementById('s-season').value.trim();
      const loading = document.getElementById('s-loading');
      const error = document.getElementById('s-error');
      const result = document.getElementById('s-result');

      if (!player || !season) { showError('s-error', 'Enter a player name and season.'); return; }

      loading.style.display = 'block';
      error.style.display = 'none';
      result.classList.remove('visible');

      try {
        const res = await fetch('/player', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ player, season })
        });
        const data = await res.json();
        loading.style.display = 'none';
        if (data.error) { showError('s-error', data.error); return; }
        document.getElementById('s-name').textContent = data.player + ' — ' + season;
        document.getElementById('s-ppg').textContent = data.ppg;
        document.getElementById('s-ast').textContent = data.ast;
        document.getElementById('s-reb').textContent = data.reb;
        result.classList.add('visible');
      } catch (e) {
        loading.style.display = 'none';
        showError('s-error', 'Something went wrong. Is Flask running?');
      }
    }

    async function doCompare() {
      const p1 = document.getElementById('c-p1').value.trim();
      const p2 = document.getElementById('c-p2').value.trim();
      const season = document.getElementById('c-season').value.trim();
      const loading = document.getElementById('c-loading');
      const error = document.getElementById('c-error');

      if (!p1 || !p2 || !season) { showError('c-error', 'Fill in both players and a season.'); return; }

      loading.style.display = 'block';
      error.style.display = 'none';
      document.getElementById('c-card1').classList.remove('visible');
      document.getElementById('c-card2').classList.remove('visible');

      try {
        const res = await fetch('/compare', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ player1: p1, player2: p2, season })
        });
        const data = await res.json();
        loading.style.display = 'none';
        if (data.error) { showError('c-error', data.error); return; }

        const s1 = data.player1, s2 = data.player2;
        document.getElementById('c-name1').textContent = s1.player;
        document.getElementById('c-name2').textContent = s2.player;
        setCompare('ppg', s1.ppg, s2.ppg);
        setCompare('ast', s1.ast, s2.ast);
        setCompare('reb', s1.reb, s2.reb);
        document.getElementById('c-card1').classList.add('visible');
        document.getElementById('c-card2').classList.add('visible');
      } catch (e) {
        loading.style.display = 'none';
        showError('c-error', 'Something went wrong. Is Flask running?');
      }
    }

    function setCompare(stat, v1, v2) {
      const el1 = document.getElementById('c1-' + stat);
      const el2 = document.getElementById('c2-' + stat);
      el1.textContent = v1;
      el2.textContent = v2;
      el1.classList.toggle('winner', parseFloat(v1) > parseFloat(v2));
      el2.classList.toggle('winner', parseFloat(v2) > parseFloat(v1));
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
